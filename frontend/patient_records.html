<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records System - KPME</title>

    <!-- Distinctive Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Space+Mono:wght@400;700&family=Crimson+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .patient-records-page {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--saffron-primary);
            padding-bottom: 20px;
        }

        .page-header h1 {
            font-family: var(--font-code);
            font-size: 2.5rem;
            color: var(--green-primary);
            margin: 0;
            text-transform: uppercase;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: var(--border-medium) solid var(--border-color);
            border-bottom: none;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            top: 2px;
        }

        .tab:hover {
            background: var(--cream-bg);
        }

        .tab.active {
            background: var(--cream-bg);
            border-color: var(--saffron-primary);
            color: var(--saffron-primary);
            font-weight: 700;
        }

        .patient-form, .prescription-form, .search-section {
            background: var(--cream-bg);
            padding: 30px;
            border: var(--border-medium) solid var(--green-primary);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--green-primary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 10px;
            border: var(--border-medium) solid var(--border-color);
            background: white;
            font-family: var(--font-mono);
            font-size: 0.95rem;
        }

        .form-field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .patient-list {
            display: grid;
            gap: 20px;
        }

        .patient-card {
            background: var(--cream-bg);
            border: var(--border-medium) solid var(--green-primary);
            padding: 20px;
            position: relative;
        }

        .patient-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: var(--border-thin) solid var(--border-color);
        }

        .patient-card-header h3 {
            font-family: var(--font-code);
            color: var(--saffron-primary);
            margin: 0;
        }

        .patient-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .detail-item {
            display: flex;
            gap: 8px;
        }

        .detail-label {
            font-weight: 700;
            color: var(--green-primary);
        }

        .prescription-list {
            margin-top: 20px;
            padding-top: 20px;
            border-top: var(--border-thin) solid var(--border-color);
        }

        .prescription-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--saffron-primary);
        }

        .prescription-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .prescription-date {
            font-family: var(--font-code);
            color: var(--saffron-primary);
            font-weight: 700;
        }

        .prescription-doctor {
            font-family: var(--font-mono);
            color: var(--green-primary);
        }

        .prescription-details {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px;
            border: var(--border-medium) solid var(--green-primary);
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--saffron-secondary);
            color: white;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .badge-green {
            background: var(--green-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-family: var(--font-serif);
            font-size: 1.2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--cream-bg);
            border: var(--border-medium) solid var(--saffron-primary);
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-code);
            font-size: 2.5rem;
            color: var(--saffron-primary);
            font-weight: 700;
        }

        .stat-label {
            font-family: var(--font-mono);
            color: var(--green-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--green-primary);
            font-family: var(--font-mono);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            color: var(--saffron-primary);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="chatbot-root"></div>
    <script type="text/babel" src="patient_records_app.js?v=3"></script>
    <script type="text/babel" src="chatbot.js?v=1"></script>
    <script type="text/babel">
        // Render chatbot
        const chatbotRoot = ReactDOM.createRoot(document.getElementById('chatbot-root'));
        chatbotRoot.render(<Chatbot />);
    </script>
</body>
</html>
